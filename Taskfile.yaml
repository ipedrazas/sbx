version: "3"

vars:
  BIN: bin/sbx
  VERSION: '{{.VERSION | default "0.1.10"}}'
  GIT_SHA:
    sh: git rev-parse --short=12 HEAD 2>/dev/null || echo unknown
  BUILD_TIME:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  VERSION_PKG: github.com/ipedrazas/sbx/internal/version
  LDFLAGS: >-
    -s -w
    -X {{.VERSION_PKG}}.Version={{.VERSION}}
    -X {{.VERSION_PKG}}.GitSHA={{.GIT_SHA}}
    -X {{.VERSION_PKG}}.BuildTime={{.BUILD_TIME}}
  PORT: '{{.PORT | default "9820"}}'
  COVERAGE_MIN: 45
  IMAGE: sbx

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # ── Build ──

  build:
    desc: Build the sbx binary into bin/
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - internal/server/openapi.json
    generates:
      - "{{.BIN}}"
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags "{{.LDFLAGS}}" -o {{.BIN}} ./cmd/sbx

  build:all:
    desc: Cross-compile release binaries into dist/ (linux amd64/arm64, darwin arm64)
    cmds:
      - for: [linux/amd64, linux/arm64, darwin/arm64]
        cmd: >-
          CGO_ENABLED=0 GOOS={{splitList "/" .ITEM | first}} GOARCH={{splitList "/" .ITEM | last}}
          go build -trimpath -ldflags "{{.LDFLAGS}}"
          -o dist/sbx-{{splitList "/" .ITEM | first}}-{{splitList "/" .ITEM | last}} ./cmd/sbx

  # ── Run ──

  run:
    desc: Run sbx on :{{.PORT}} (kills an existing instance first); pass flags after --, e.g. `task run -- --data-dir /tmp/x`
    deps: [build, kill]
    cmds:
      - ./{{.BIN}} --port {{.PORT}} {{.CLI_ARGS}}

  kill:
    desc: Stop a running sbx
    cmds:
      - pkill -x sbx || true

  version:
    desc: Print the build version
    deps: [build]
    cmds:
      - ./{{.BIN}} version

  openapi:
    desc: Print the OpenAPI spec
    deps: [build]
    cmds:
      - ./{{.BIN}} --dump-openapi

  # ── Check / Lint ──

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  lint:
    desc: Check formatting and run go vet
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - go vet ./...

  tidy:
    desc: Tidy go.mod / go.sum
    cmds:
      - go mod tidy

  # ── Test ──

  test:
    desc: Run all tests with the race detector
    cmds:
      - go test -race ./...

  test:pkg:
    desc: Test one package, e.g. `task test:pkg -- ./internal/server/ -run TestLive`
    cmds:
      - go test -race {{.CLI_ARGS}}

  cover:
    desc: Run tests with coverage and fail below {{.COVERAGE_MIN}}%
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1
      - |
        total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
        awk -v t="$total" -v m={{.COVERAGE_MIN}} 'BEGIN { if (t+0 < m+0) { printf "coverage %.1f%% < %d%%\n", t, m; exit 1 } }'

  cover:html:
    desc: Open an HTML coverage report
    deps: [cover]
    cmds:
      - go tool cover -html=coverage.out

  ci:
    desc: Run what CI runs (lint + coverage gate)
    cmds:
      - task: lint
      - task: cover

  # ── Docker ──

  docker:build:
    desc: Build the Docker image {{.IMAGE}}:{{.VERSION}}
    cmds:
      - >-
        docker build
        --build-arg VERSION={{.VERSION}}
        --build-arg GIT_SHA={{.GIT_SHA}}
        --build-arg BUILD_TIME={{.BUILD_TIME}}
        -t {{.IMAGE}}:{{.VERSION}} -t {{.IMAGE}}:latest .

  docker:run:
    desc: Run the image on :{{.PORT}} with a named data volume
    deps: [docker:build]
    cmds:
      - docker run --rm -p {{.PORT}}:9820 -v sbx-data:/root/.dstudio -e DSTUDIO_MANAGE_TOKEN {{.IMAGE}}:{{.VERSION}}

  compose:up:
    desc: Start via docker compose (rebuilds the image)
    cmds:
      - docker compose up --build -d

  compose:down:
    desc: Stop the docker compose stack
    cmds:
      - docker compose down

  # ── Clean ──

  clean:
    desc: Remove build and coverage output
    cmds:
      - rm -rf bin dist coverage.out
